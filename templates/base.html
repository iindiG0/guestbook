<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1c1917; color: #e7e5e4; margin: 0; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 1.6rem; }
    h1 a { color: inherit; text-decoration: none; }
    a { color: #fbbf24; }
    .meta { color: #a8a29e; font-size: .85rem; margin: 4px 0 20px; }
    .nav { display: flex; gap: 10px; align-items: center; font-size: .95rem; }
    .nav form { margin: 0; }
    .flash { background: #292524; border-left: 4px solid #fbbf24; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
    .card { background: #292524; border: 1px solid #44403c; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    form.stack { display: grid; gap: 10px; }
    input, textarea { background: #1c1917; color: inherit; border: 1px solid #44403c; border-radius: 8px; padding: 10px; font: inherit; }
    button { background: #f59e0b; color: #1c1917; border: 0; border-radius: 8px; padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; }
    button.link { background: none; color: #fbbf24; padding: 0; font-weight: 400; text-decoration: underline; }
    button.danger { background: none; color: #f87171; border: 1px solid #7f1d1d; padding: 3px 10px; font-weight: 400; font-size: .8rem; }
    .msg-head { display: flex; justify-content: space-between; color: #a8a29e; font-size: .85rem; margin-bottom: 6px; }
    .msg-body { white-space: pre-wrap; margin: 0; }
    .msg-actions { margin-top: 8px; text-align: right; }
    .msg-actions form { margin: 0; }
    .muted { color: #a8a29e; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><a href="{{ url_for('index') }}">📖 {{ title }}</a></h1>
      <div class="nav">
        {% if g.user %}
          <span>Hi, <b>{{ g.user.username }}</b></span>
          <form method="post" action="{{ url_for('logout') }}">
            <input type="hidden" name="csrf" value="{{ csrf_token() }}">
            <button class="link">Log out</button>
          </form>
        {% else %}
          <a href="{{ url_for('login') }}">Log in</a>
          <a href="{{ url_for('register') }}">Register</a>
        {% endif %}
      </div>
    </header>
    <p class="meta">Python + Flask, rendered on the server · pod <b>{{ pod }}</b></p>

    {% for message in get_flashed_messages() %}
      <div class="flash">{{ message }}</div>
    {% endfor %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
